services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vca
      POSTGRES_USER: vca
      POSTGRES_PASSWORD: vca_dev_password
    ports:
      - "5432:5432"
    volumes:
      - vca_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vca -d vca"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vca_postgres_data:
